# Menkerud Home call-backend — Docker container on Unraid.
# LiveKit runs separately (its own install at /mnt/user/appdata/LiveKit/config.yaml) — not managed here.
# This container listens on 3000 inside, is published on host port 3008, and joins the existing
# noobventure-network so SWAG reaches it by name (menkerud-callapi:3000). Secrets come from .env.
#
# Deploy on Unraid (put this folder somewhere like /mnt/user/appdata/menkerud-call, with a filled .env):
#   docker compose up -d --build
services:
  callapi:
    build: .
    container_name: menkerud-callapi
    restart: unless-stopped
    env_file: .env
    ports:
      - "3008:3000"          # host 3008 -> container 3000 (the app listens on 3000; 3008 for host/debug access)
    networks:
      - noobventure-network

networks:
  noobventure-network:
    external: true            # the shared Unraid network SWAG is on (must already exist)
