# SWAG proxy-conf: ha.noobventure.com -> Home Assistant container on br0 (192.168.68.3:8123).
# Copy to /config/nginx/proxy-confs/ on Unraid (SWAG wildcard cert covers the subdomain; ports 80/443 already reach SWAG).
# HA must trust SWAG's br0 IP (192.168.68.4): Settings -> System -> Network -> "HTTP server" ->
# Trust X-Forwarded-For + Trusted proxies. Until then every proxied request is answered 400.
# The kiosk keeps using the LAN URL; this host is for the Companion apps when the phones are away.
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name ha.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 0;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app 192.168.68.3;
        set $upstream_port 8123;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
