# SWAG reverse proxy for the LiveKit signaling endpoint (wss://rtc.noobventure.com).
# Save as /config/nginx/proxy-confs/rtc.subdomain.conf and reload SWAG.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rtc.*;
    include /config/nginx/ssl.conf;
    client_max_body_size 0;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app 192.168.68.2;
        set $upstream_port 7880;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
        # SWAG's proxy.conf (included above) already sets proxy_http_version 1.1 and the
        # Upgrade/Connection headers for WebSockets — do not repeat them here (nginx errors on duplicates).
    }
}
