# SWAG reverse proxy for the call backend + parent answer page (https://call.noobventure.com).
# The call-backend is a Docker container on Unraid (menkerud-callapi) joined to noobventure-network,
# so SWAG reaches it by container name. SWAG must also be on noobventure-network.
# Save as /config/nginx/proxy-confs/call.subdomain.conf on Unraid and reload SWAG.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name call.*;
    include /config/nginx/ssl.conf;
    client_max_body_size 1m;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app menkerud-callapi;   # container on noobventure-network (host-published as 3008 for debugging)
        set $upstream_port 3000;              # container-internal port
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
