# SWAG reverse proxy for the call backend + parent answer page (https://call.noobventure.com).
# The backend runs on the Ubuntu touchscreen PC (systemd), NOT on Unraid, so this points at that PC's LAN IP.
# Save as /config/nginx/proxy-confs/call.subdomain.conf on Unraid and reload SWAG.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name call.*;
    include /config/nginx/ssl.conf;
    client_max_body_size 1m;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app 192.168.68.60;   # <-- the Ubuntu touchscreen PC's LAN IP (give it a DHCP reservation)
        set $upstream_port 3000;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
