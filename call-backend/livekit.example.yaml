# LiveKit server config — REFERENCE ONLY. The family's running install is authoritative and lives at
# /mnt/user/appdata/LiveKit/config.yaml on Unraid; do not change that install's Docker networking to match this.
# The single UDP mux port (7882) is the only media port to forward. Do NOT enable the 50000-60000 UDP range
# (the old Unraid template exposed it and caused problems).
port: 7880
rtc:
  tcp_port: 7881          # optional WebRTC-over-TCP fallback
  udp_port: 7882          # single-port UDP mux; no 50000-60000 range needed
  use_external_ip: true   # STUN-discover the public IP so phones on mobile data can reach the media
logging:
  level: info
keys:
  # <API_KEY>: <API_SECRET>  — must match LIVEKIT_API_KEY / LIVEKIT_API_SECRET in the backend .env
  devkey: devsecret_change_me
