# Menkerud Home — nginx site on the Ubuntu touchscreen. Serves the static frontend only.
# The call-backend is NOT here (it runs as a Docker container on Unraid); the kiosk calls it directly at
# https://call.noobventure.com, so there is no /api proxy on this machine. Install with:
#   sudo cp /var/www/menkerud-home/call-backend/deploy/nginx-menkerud.conf /etc/nginx/sites-available/menkerud
#   sudo ln -sf /etc/nginx/sites-available/menkerud /etc/nginx/sites-enabled/menkerud
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Bound to 127.0.0.1 so config.js (which holds the Discord token) never leaves the machine, and so the page
# is served from http://localhost — a secure context, which the camera/mic (LiveKit) require. Firefox opens http://localhost.
server {
    listen 127.0.0.1:80 default_server;
    server_name localhost;

    root /var/www/menkerud-home;
    index index.html;

    # Cache static art
    location ~* \.(png|jpg|jpeg|webp|gif|svg|woff2?|ttf|mp3)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Photo frame (Bilderamme): the page lists these folders itself (JSON) and walks subfolders, so pictures
    # only need to be dropped in. "^~" keeps the image-caching regex location above from hijacking these
    # paths (it would ignore the alias).
    location ^~ /photos/ {                 # photos/ inside the git checkout – local pictures
        autoindex on;
        autoindex_format json;
    }
    location ^~ /bilder/ {                 # a network share mounted at /mnt/bilder (SETUP.md §3) – Bildemappe = /bilder/
        alias /mnt/bilder/;
        autoindex on;
        autoindex_format json;
    }

    # Fall back to the dashboard for any other path
    location / {
        try_files $uri $uri/ /index.html;
    }
}
