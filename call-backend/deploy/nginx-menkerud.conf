# Menkerud Home — nginx site. Serves the git checkout directly (the repo root IS the web root) and
# proxies /api to the local Node backend. Install with:
#   sudo cp call-backend/deploy/nginx-menkerud.conf /etc/nginx/sites-available/menkerud
#   sudo ln -sf /etc/nginx/sites-available/menkerud /etc/nginx/sites-enabled/menkerud
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Bound to 127.0.0.1 so config.js (which holds the Discord token) never leaves the machine, and so the page
# is served from http://localhost — a secure context, which the camera/mic (LiveKit) require. Firefox opens
# http://localhost. External parents reach the backend for the answer page via SWAG -> this PC:3000 instead.
server {
    listen 127.0.0.1:80 default_server;
    server_name localhost;

    root /home/menkerud/menkerud-home;
    index index.html;

    # API -> local Node backend (systemd service menkerud-backend on :3000)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Cache static art
    location ~* \.(png|jpg|jpeg|webp|gif|svg|woff2?|ttf|mp3)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Fall back to the dashboard for any other path
    location / {
        try_files $uri $uri/ /index.html;
    }
}
